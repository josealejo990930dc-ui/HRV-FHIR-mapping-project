name: validate
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python tools/build_templates.py && git diff --exit-code
      - run: pytest -q
  hl7-validator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python tools/generate_synthetic.py --n 2 --hours 6 --out out
      - name: Download HL7 validator
        run: curl -L -o validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar
      - name: Validate (R4)
        run: java -jar validator_cli.jar -version 4.0.1 examples/bundle-synthetic-patient.json templates/*.json out/*.json -ig terminology/CodeSystem-hrv-sepsis.json -tx n/a
